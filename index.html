<title>ค้นหาราคา Beger ทุกห้าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky search bar on top, filter row, then a single column of product cards; each card holds a wrapping grid of chain price tiles */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#eaeef2; --line:#d7dde4;
  --fg:#17212b; --muted:#5d6b78; --accent:#0b5cad; --accent-ink:#ffffff;
  --accent-soft:#e2edf9; --best:#0f7a4f; --best-soft:#dff3ea; --warn:#9a5b00; --warn-soft:#fbefd9;
  --mark:#fff0a8; --th:#f6dcc8; --th-fg:#3a2414; --bc:#fff7b0; --cost:#fbeee4; --hover:rgba(11,92,173,.06);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#16202a; --surface2:#1d2934; --line:#2b3a47;
  --fg:#e5ecf2; --muted:#93a3b2; --accent:#5ea8f2; --accent-ink:#0b1622;
  --accent-soft:#16304a; --best:#4fd19a; --best-soft:#123326; --warn:#f0b15a; --warn-soft:#3a2a12;
  --mark:#5c4d0a; --th:#3a2a1f; --th-fg:#f3dcc9; --bc:#3a3612; --cost:#2b221b; --hover:rgba(94,168,242,.08); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --surface2:#1d2934; --line:#2b3a47;
  --fg:#e5ecf2; --muted:#93a3b2; --accent:#5ea8f2; --accent-ink:#0b1622;
  --accent-soft:#16304a; --best:#4fd19a; --best-soft:#123326; --warn:#f0b15a; --warn-soft:#3a2a12;
  --mark:#5c4d0a; --th:#3a2a1f; --th-fg:#f3dcc9; --bc:#3a3612; --cost:#2b221b; --hover:rgba(94,168,242,.08); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.filterbar{padding-block:10px 0}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:0;letter-spacing:.01em;text-wrap:balance}
.meta{color:var(--muted);font-size:.82rem}
.searchbox{position:relative}
#q{width:100%;font:inherit;font-size:1.05rem;padding:12px 44px 12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:1.3rem;width:34px;height:34px;border-radius:8px;cursor:pointer}
#clear:hover{background:var(--surface2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#fMkt{max-width:260px}
select,.btn{font:inherit;font-size:.86rem;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;max-width:100%}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chains{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chains .lbl{font-size:.78rem;color:var(--muted);letter-spacing:.04em;margin-right:2px}
.chip{font-family:var(--f-mono);font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ghost{font-family:var(--f-body);font-weight:500}
main{padding-block:14px 48px}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:.88rem;color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem;margin-bottom:10px}
.suggest{margin-bottom:10px;font-size:.88rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.suggest button{font:inherit;font-size:.86rem;border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;min-width:0}
.c-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.c-name{font-weight:600;font-size:1.02rem;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.c-en{color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}
.listp{text-align:right;flex:none}
.listp .k{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.listp .v{font-family:var(--f-mono);font-weight:600;font-size:1.02rem;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.76rem;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.mono{font-family:var(--f-mono);cursor:copy}
.tag.size{background:var(--accent-soft);color:var(--accent);font-weight:600;font-family:var(--f-mono)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.tile{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .cn{font-family:var(--f-mono);font-size:.74rem;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.tile .nt{font-family:var(--f-mono);font-weight:600;font-size:.98rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .off{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.best{background:var(--best-soft);border-color:var(--best)}
.tile.best .cn span:last-child{color:var(--best)}
.tile.special .cn span:last-child{color:var(--warn)}
.detail{margin-top:10px;overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--surface2);color:var(--muted);font-weight:600;font-size:.74rem;letter-spacing:.03em}
td:first-child,th:first-child{text-align:left;font-family:var(--f-mono);font-weight:600;position:sticky;left:0;background:var(--surface)}
th:first-child{background:var(--surface2)}
td.z{color:var(--line)}
td.ntt{font-family:var(--f-mono);font-weight:600}
tr.best td{background:var(--best-soft)}
tr:last-child td{border-bottom:0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.more{display:flex;justify-content:center;margin-top:14px}
.more .btn{padding:9px 18px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.legend{font-size:.78rem;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.86rem;z-index:30}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;font-size:.88rem}
.panel h2{font-family:var(--f-display);font-size:1rem;margin:0 0 6px}
.panel p{margin:4px 0;color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:560px){.filters{display:grid;grid-template-columns:1fr 1fr}#fMkt{max-width:none}.filters>*{min-width:0;width:100%}h1{font-size:1.12rem}.listp .v{font-size:.95rem}.tiles{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}}
@media (max-width:560px) and (min-width:370px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.tile{padding:5px 5px}.tile .nt{font-size:.92rem}.tile .off,.tile .cn{font-size:.66rem}.tile .cn span:last-child{display:none}.tile.best .cn span:first-child{color:var(--best)}}
table.tt th,table.tt td{text-align:right}
table.tt th{font-family:var(--f-mono);font-size:.78rem}
table.tt td:first-child{text-align:left;font-family:var(--f-body);font-weight:500;color:var(--muted)}
table.tt .bcol{background:var(--best-soft)}
table.tt th.bcol{color:var(--best)}
table.tt tr.lp td{font-weight:600}
table.tt tr.nr td{border-top:1.5px solid var(--fg);font-size:.92rem}
table.tt tr.nr td:first-child{color:var(--fg);font-weight:600}
.detail{margin-top:12px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
table.ht{width:100%;font-size:.8rem}
table.ht th,table.ht td{padding:7px 6px;text-align:right;white-space:nowrap}
table.ht th{font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:0}
table.ht td.cn{font-family:var(--f-mono);font-weight:600;text-align:left}
table.ht th:first-child{text-align:left}
table.ht td.d{color:var(--fg)}
table.ht td.z{color:var(--line)}
table.ht td.ntt{font-family:var(--f-mono);font-weight:600;font-size:.86rem}
table.ht td.tot{color:var(--muted);font-size:.74rem}
table.ht tr.best td{background:var(--best-soft)}
table.ht tr.best td.cn,table.ht tr.best td.ntt{color:var(--best)}
table.ht .sp{color:var(--warn);font-size:.6rem;vertical-align:super;margin-left:1px}
table.ht .ls{display:none}
.unit{font-size:.72rem;color:var(--muted);margin-top:4px}
@media (max-width:560px){
  .card{padding:12px 10px 10px}
  table.ht{font-size:.74rem}
  table.ht th,table.ht td{padding:6px 3px}
  table.ht th:first-child,table.ht td:first-child{padding-left:6px}
  table.ht th:last-child,table.ht td:last-child{padding-right:6px}
  table.ht .lf{display:none} table.ht .ls{display:inline}
  table.ht td.ntt{font-size:.8rem}
}
.gpbox{display:flex;white-space:nowrap;justify-content:space-between;align-items:center;gap:6px;font-size:.86rem;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--accent);font-weight:600}
.gpbox input{width:58px;font:inherit;font-family:var(--f-mono);text-align:right;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
table.ht td.sell{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:.86rem}
table.ht th.sell{color:var(--accent)}
@media (max-width:560px){table.ht td.sell{font-size:.8rem}}
.viewbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.86rem;border:0;background:transparent;color:var(--muted);padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg.tabs button{font-family:var(--f-mono);font-weight:600;min-width:52px}
.sheet{overflow:auto;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);border:1px solid var(--line);border-radius:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
table.st{border-collapse:separate;border-spacing:0;font-size:.8rem;width:max-content;min-width:100%}
table.st th,table.st td{padding:7px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;text-align:right}
table.st thead th{position:sticky;background:var(--th);color:var(--th-fg);font-weight:600;font-size:.74rem;text-align:center;z-index:2}
table.st thead tr:first-child th{top:0;height:24px;padding:3px 9px;background:var(--surface);border-bottom:0}
table.st thead tr:nth-child(2) th{top:24px}
table.st th.chainband{background:var(--surface);color:var(--accent);font-family:var(--f-display);font-size:1rem;font-weight:700;letter-spacing:.06em}
table.st .stick{position:sticky;left:0;z-index:1;background:var(--surface)}
table.st thead .stick{z-index:3;background:var(--th)}
table.st thead tr:first-child .stick{background:var(--surface)}
table.st td.bc{font-family:var(--f-mono);background:var(--bc);font-size:.76rem;cursor:copy;text-align:center}
table.st td.nm{text-align:left;white-space:normal;min-width:200px;max-width:280px}
table.st td.tx{text-align:left;color:var(--muted);font-size:.76rem}
table.st td.c{text-align:center;font-family:var(--f-mono);color:var(--fg)}
table.st td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.st td.z{color:var(--muted)}
table.st td.cost{background:var(--cost);font-weight:600}
table.st td.gp,table.st th.gp{color:var(--accent);font-weight:600}
table.st td.gp{text-align:center}
table.st td.sell{background:var(--cost);font-weight:700;font-size:.86rem}
table.st .sp{color:var(--warn);font-size:.6rem;vertical-align:super;margin-left:2px}
table.st tbody tr:hover td{background-image:linear-gradient(var(--hover),var(--hover))}
@media (max-width:560px){table.st{font-size:.76rem}table.st th,table.st td{padding:6px 7px}table.st td.nm{min-width:160px}table.st td.bc{font-size:.68rem;padding:6px 5px}}
.exp{display:flex;gap:8px;margin-left:auto}
.exp .btn{font-weight:600;color:var(--accent);border-color:var(--accent)}
.exp .btn:disabled{opacity:.6;cursor:wait}
@media (max-width:560px){.exp{width:100%;margin-left:0}.exp .btn{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <h1>ค้นหาราคา Beger ทุกห้าง</h1>
      <span class="meta" id="meta">กำลังโหลดข้อมูล…</span>
    </div>
    <div class="searchbox">
      <input id="q" type="search" autocomplete="off" placeholder="พิมพ์ชื่อสินค้า, รหัส ITEM, บาร์โค้ด, เฉดสี… (สะกดผิดเล็กน้อยก็หาเจอ)" aria-label="ค้นหาสินค้า">
      <button id="clear" type="button" aria-label="ล้างคำค้น" hidden>×</button>
    </div>
  </div>
</header>
<section class="filterbar">
  <div class="wrap">
    <div class="filters">
      <select id="fSize" aria-label="ขนาด"><option value="">ทุกขนาด</option></select>
      <select id="fMkt" aria-label="กลุ่มสินค้า"><option value="">ทุกกลุ่มสินค้า</option></select>
      <select id="fSort" aria-label="เรียงลำดับ">
        <option value="rel">เรียง: ตรงคำค้นที่สุด</option>
        <option value="ntt">เรียง: NTT ต่ำ → สูง</option>
        <option value="nttd">เรียง: NTT สูง → ต่ำ</option>
        <option value="no">เรียง: ลำดับในไฟล์</option>
      </select>
      <button class="btn" id="btnDetail" type="button" aria-pressed="true">ซ่อนส่วนลดทุกขั้น</button>
      <label class="gpbox" for="gp">GP% แนะนำ <input id="gp" type="number" inputmode="decimal" min="0" max="99" step="0.5" value="18"></label>
      <button class="btn" id="btnImport" type="button">อัปเดตจากไฟล์ Excel</button>
      <input id="file" type="file" accept=".xlsx,.xls" hidden>
    </div>
    <div class="chains" id="chains"><span class="lbl">ห้าง</span></div>
  </div>
</section>

<main class="wrap">
  <div id="importPanel" class="panel" hidden></div>
  <div id="notice" class="notice" hidden></div>
  <div id="suggest" class="suggest" hidden></div>
  <div class="status"><span id="count"></span><span class="legend">ราคาทุน Exvat (NTT) = ราคาหลังหักส่วนลดทุกขั้น · ราคาขายรวม Vat = ทุน ÷ (1 − GP%) × 1.07 ปัดเป็นบาท · ช่องสีเขียว = ห้างที่ NTT ต่ำสุด · <span style="color:var(--warn)">●</span> = NTT ราคาพิเศษ (ไม่ตรงสูตรส่วนลด)</span></div>
  <div id="viewbar" class="viewbar"></div>
  <div id="list" class="list"><div class="loading">กำลังโหลดข้อมูลราคา…</div></div>
  <div class="more"><button class="btn" id="btnMore" type="button" hidden>แสดงเพิ่ม</button></div>

/* ราคาขายรวม VAT = ROUND( ราคาทุน Ex VAT / (1 - GP%) * 1.07 , 0 ) */
const sellOf=n=>n==null||n<=0||GP>=100?null:Math.round(n/(1-GP/100)*1.07);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- text normalisation ---------- */
const TONE=/[็-๎]/g;   // ็ ่ ้ ๊ ๋ ์ ํ ๎ — ignored so missing/wrong tone marks still match
function norm(s){
  return String(s==null?"":s).toLowerCase().normalize("NFC").replace(TONE,"")
    .replace(/[()\[\]{},.:;\/\\_+*'"!?&|<>=~`^]/g," ").replace(/\s+/g," ").trim();
}
const compact=s=>s.replace(/[\s#\-]/g,"");

/* ---------- data: packed seed ---------- */
async function decodeSeed(){
  const b64=$("seed").textContent.trim();
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
function netOf(l,disc){ if(l==null) return null; let n=l; disc.forEach(x=>n*=(1-(x||0))); return Math.round(n*100+1e-7)/100; }
function expandPacked(P){
  // row: id,bc,en,th, mkt,brand,sub,spec,grp,use,feat (dict idx), shade,size, list(s), pattern, overrides?
  const d=P.dicts;
  const items=P.items.map((r,ix)=>{
    const pat=P.pats[r[14]], ov=r[15]||{};
    const lists=Array.isArray(r[13])?r[13]:P.chains.map(()=>r[13]);
    const prices=P.chains.map((_,k)=>{
      const l=lists[k], disc=P.combos[pat[k]];
      const sp=Object.prototype.hasOwnProperty.call(ov,k);
      const calc=netOf(l,disc);
      return {l,d:disc,n:sp?ov[k]:calc,sp:sp&&ov[k]!=null&&calc!=null&&Math.abs(calc-ov[k])>0.011};
    });
    return {no:ix+1,id:r[0],bc:r[1],en:r[2],th:r[3],mkt:d.mkt[r[4]],brand:d.brand[r[5]],sub:d.sub[r[6]],
      spec:d.spec[r[7]],grp:d.grp[r[8]],use:d.use[r[9]],feat:d.feat[r[10]],shade:r[11],size:r[12],prices};
  });
  return {chains:P.chains,items};
}

/* ---------- data: Excel import (same layout as the price file) ---------- */
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  // find header row: the one containing "ITEM ID"
  let h=A.findIndex(r=>r&&r.some(v=>String(v||"").trim().toUpperCase()==="ITEM ID"));
  if(h<1) throw new Error("ไม่พบหัวคอลัมน์ ITEM ID ในชีตแรก");
  const H=A[h].map(v=>String(v||"").replace(/\s+/g," ").trim().toUpperCase());
  const col=(name,fb)=>{const i=H.indexOf(name);return i>=0?i:fb;};
  const c={id:col("ITEM ID",1),bc:col("BARCODE",2),en:col("DESCR_EN",3),th:col("DESCR_TH",4),mkt:col("MKT NAME",6),
    brand:col("L2_BRAND",8),sub:col("L3_SUBBRAND",9),spec:col("L4_BRANDSPECIAL",10),grp:col("L5_PRODUCTGROUP",11),
    use:col("L7_USAGEAREA",13),feat:col("L8_FEATURE",14),shade:col("L11_SHADE",17),size:col("SIZE",18)};
  const first=H.findIndex(v=>v.startsWith("ราคาตั้ง"));
  if(first<0) throw new Error("ไม่พบคอลัมน์ ราคาตั้ง");
  const top=A[h-1]||[];
  const chains=[];
  for(let k=first;k<H.length;k+=11){ const nm=top[k]; if(nm==null||String(nm).trim()==="") break; chains.push(String(nm).trim()); }
  if(!chains.length) throw new Error("ไม่พบชื่อห้างในแถวบนหัวคอลัมน์");
  const KEEP=["DH","HS","HH","HO"];
  const keepIdx=KEEP.map(c=>chains.findIndex(x=>x.toUpperCase()===c)).filter(i=>i>=0);
  if(!keepIdx.length) throw new Error("ไม่พบห้าง DH, HS, HH, HO ในไฟล์");
  const num=v=>typeof v==="number"?v:(v==null||v===""?null:(isNaN(+v)?null:+v));
  const s=v=>v==null?"":String(v).trim();
  const items=[];
  for(let i=h+1;i<A.length;i++){
    const r=A[i]; if(!r||!s(r[c.id])) continue;
    const prices=keepIdx.map(k=>{
      const b=first+11*k, l=num(r[b]), disc=[];
      for(let j=1;j<=9;j++) disc.push(num(r[b+j])||0);
      const given=num(r[b+10]), calc=netOf(l,disc);
      const n=given==null?calc:Math.round(given*100)/100;
      return {l,d:disc,n,sp:given!=null&&calc!=null&&Math.abs(calc-given)>0.011};
    });
    items.push({no:items.length+1,id:s(r[c.id]),bc:s(r[c.bc]),en:s(r[c.en]),th:s(r[c.th]),mkt:s(r[c.mkt]),brand:s(r[c.brand]),
      sub:s(r[c.sub]),spec:s(r[c.spec]),grp:s(r[c.grp]),use:s(r[c.use]),feat:s(r[c.feat]),shade:s(r[c.shade]),size:s(r[c.size]),prices});
  }
  if(!items.length) throw new Error("ไม่พบแถวสินค้า");
  return {chains:keepIdx.map(k=>chains[k]),items};
}
/* IndexedDB keeps an imported file in this browser only */
function idb(){return new Promise((res,rej)=>{try{const q=indexedDB.open("beger_price_finder",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e)}});}
async function idbPut(v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction("f","readwrite");t.objectStore("f").put(v,"last");t.oncomplete=res;t.onerror=()=>rej(t.error);});return true;}catch(e){return false}}
async function idbGet(){try{const db=await idb();return await new Promise((res)=>{const t=db.transaction("f","readonly");const q=t.objectStore("f").get("last");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null}}
async function idbDel(){try{const db=await idb();await new Promise(res=>{const t=db.transaction("f","readwrite");t.objectStore("f").delete("last");t.oncomplete=res;t.onerror=res;});}catch(e){}}

/* ---------- index ---------- */
function buildIndex(items){
  const vocab=new Map();  // word -> array of item indexes
  const comp=new Array(items.length), name=new Array(items.length), wsets=new Array(items.length);
  items.forEach((it,i)=>{
    const hay=norm([it.id,it.bc,it.th,it.en,it.mkt,it.brand,it.sub,it.spec,it.grp,it.use,it.feat,it.shade,it.size].join(" "));
    comp[i]=compact(hay);
    name[i]=compact(norm(it.th+" "+it.en+" "+it.shade));
    const ws=new Set(hay.split(" ").map(compact).filter(Boolean));
    wsets[i]=ws;
    ws.forEach(w=>{let a=vocab.get(w);if(!a){a=[];vocab.set(w,a);}a.push(i);});
  });
  const disp=new Map();
  items.forEach(it=>String(it.th+" "+it.en).split(/\s+/).forEach(w=>{const k=compact(norm(w));if(k&&!disp.has(k))disp.set(k,w.replace(/^[(\[]+|[)\],.]+$/g,""));}));
  return {comp,name,wsets,vocab,disp,words:[...vocab.keys()]};
}

function lev(a,b,max){
  const m=a.length,n=b.length; if(Math.abs(m-n)>max) return max+1;
  let prev=new Array(n+1),cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i; let best=cur[0];
    for(let j=1;j<=n;j++){
      const cost=a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1;
      let v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,prevprev[j-2]+1);
      cur[j]=v; if(v<best) best=v;
    }
    if(best>max) return max+1;
    var prevprev=prev; prev=cur; cur=prevprev.slice(); // keep three rows
  }
  return prev[n];
}
const maxDist=len=>len<=3?0:len<=5?1:len<=9?2:3;

/* score one token across all candidate items -> Map(itemIdx -> score) */
function scoreToken(tok,cands){
  const alts=SYNMAP.get(tok)||[tok];
  const out=new Map(); let exactHits=0;
  const short=tok.length<=2;
  const digits=/^\d+$/.test(tok);
  for(const i of cands){
    let best=0;
    for(const a of alts){
      if(a.length<=2){
        // short tokens must match a whole word, a word start, or digits inside a word
        const ws=IDX.wsets[i]; let ok=ws.has(a)?1:0;
        if(!ok) for(const w of ws){ if(w.startsWith(a)||(/^\d+$/.test(a)&&w.includes(a))){ok=0.85;break;} }
        if(ok>best) best=ok;
      } else if(IDX.comp[i].includes(a)){
        const s=1+(IDX.name[i].includes(a)?0.2:0); if(s>best) best=s;
      }
    }
    if(best>0){out.set(i,best);exactHits++;}
  }
  // fuzzy over vocabulary (typos, missing letters)
  const fuzzyWords=[];
  if(!short&&!digits){
    for(const a of alts){
      const md=maxDist(a.length); if(!md) continue;
      for(const w of IDX.words){
        if(w.length<2) continue;
        let d=md+1;
        if(Math.abs(w.length-a.length)<=md) d=lev(a,w,md);
        if(d>md&&a.length>=4&&w.length>a.length) d=lev(a,w.slice(0,a.length),md);
        if(d<=md&&d>0) fuzzyWords.push([w,d]);
      }
    }
    for(const [w,d] of fuzzyWords){
      const s=0.8-0.15*d;
      for(const i of IDX.vocab.get(w)){ if(cands.has(i)&&(out.get(i)||0)<s) out.set(i,s); }
    }
    // trigram overlap for run-together Thai or longer phrases
    if(tok.length>=5&&/[\u0E00-\u0E7F]/.test(tok)){
      const g=[];for(let k=0;k+3<=tok.length;k++) g.push(tok.slice(k,k+3));
      const ug=[...new Set(g)];
      for(const i of cands){
        if(out.has(i)) continue;
        const c=IDX.comp[i]; let hit=0; for(const x of ug) if(c.includes(x)) hit++;
        const r=hit/ug.length; if(r>=0.7) out.set(i,0.6*r);
      }
    }
  }
  fuzzyWords.sort((a,b)=>a[1]-b[1]||(IDX.vocab.get(b[0]).length-IDX.vocab.get(a[0]).length));
  return {map:out,exactHits,fuzzyWords};
}

function minNtt(it){let m=null;it.prices.forEach((p,k)=>{if(activeChains.has(k)&&p.n!=null&&p.n>0&&(m==null||p.n<m))m=p.n;});return m;}

function runSearch(){
  if(!DB) return;
  const raw=$("q").value;
  $("clear").hidden=!raw;
  const fs=$("fSize").value, fm=$("fMkt").value, sort=$("fSort").value;
  const cands=new Set();
  DB.items.forEach((it,i)=>{ if((!fs||it.size===fs)&&(!fm||it.mkt===fm)) cands.add(i); });
  const toks=[...new Set(norm(raw).split(" ").map(compact).filter(Boolean))];
  let list=[], relaxed=false; const sugg=[];
  hlTokens=[];
  if(!toks.length){
    list=[...cands].map(i=>({i,s:0}));
  } else {
    const per=toks.map(t=>scoreToken(t,cands));
    toks.forEach((t,k)=>{
      (SYNMAP.get(t)||[t]).forEach(a=>hlTokens.push(a));
      if(per[k].exactHits===0&&per[k].fuzzyWords.length){
        const seen=new Set(); for(const [w] of per[k].fuzzyWords){ if(seen.size>=3) break; const dw=IDX.disp.get(w)||w; if(!seen.has(dw)&&IDX.disp.has(w)){seen.add(dw);} }
        sugg.push({tok:t,words:[...seen]});
      }
    });
    const tally=new Map();
    per.forEach(p=>p.map.forEach((s,i)=>{const o=tally.get(i)||{s:0,c:0};o.s+=s;o.c++;tally.set(i,o);}));
    list=[...tally].filter(([,o])=>o.c===toks.length).map(([i,o])=>({i,s:o.s}));
    if(!list.length&&toks.length>1){
      relaxed=true;
      const need=Math.ceil(toks.length/2);
      list=[...tally].filter(([,o])=>o.c>=need).map(([i,o])=>({i,s:o.s+o.c}));
    }
  }
  const it=i=>DB.items[i];
  if(sort==="ntt"||sort==="nttd"){
    const dir=sort==="ntt"?1:-1;
    list.forEach(r=>r.m=minNtt(it(r.i)));
    list.sort((a,b)=>(a.m==null)-(b.m==null)||dir*(a.m-b.m)||a.i-b.i);
  } else if(sort==="no"||!toks.length){
    list.sort((a,b)=>a.i-b.i);
  } else {
    list.sort((a,b)=>b.s-a.s||it(a.i).th.length-it(b.i).th.length||a.i-b.i);
  }
  results=list.map(r=>r.i); shown=PAGE;
  // notices
  const nb=$("notice");
  if(relaxed&&results.length){nb.hidden=false;nb.textContent="ไม่พบสินค้าที่ตรงครบทุกคำ จึงแสดงรายการที่ใกล้เคียงที่สุดแทน";}
  else nb.hidden=true;
  renderSuggest(toks.length?sugg:null);
  $("count").textContent=(toks.length?"พบ ":"ทั้งหมด ")+results.length.toLocaleString("th-TH")+" รายการ";
  render();
}

function renderSuggest(sugg){
  const box=$("suggest"); box.innerHTML="";
  if(sugg===null){
    box.hidden=false;
    box.append(Object.assign(document.createElement("span"),{textContent:"ลองค้น:"}));
    EXAMPLES.forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x;b.onclick=()=>{$("q").value=x;runSearch();};box.append(b);});
    return;
  }
  if(!sugg.length){box.hidden=true;return;}
  box.hidden=false;
  box.append(Object.assign(document.createElement("span"),{textContent:"คุณหมายถึง:"}));
  sugg.forEach(sg=>sg.words.forEach(w=>{
    const b=document.createElement("button");b.type="button";b.textContent=w;
    b.title="แทนคำว่า “"+sg.tok+"”";
    b.onclick=()=>{
      const parts=$("q").value.trim().split(/\s+/);
      const k=parts.findIndex(p=>compact(norm(p))===sg.tok);
      if(k>=0) parts[k]=w; $("q").value=parts.join(" "); runSearch();
    };
    box.append(b);
  }));
}

/* highlight using the original text; tone marks are optional between letters */
function hl(text){
  text=String(text||""); if(!hlTokens.length||!text) return esc(text);
  const pats=hlTokens.filter(t=>t.length>=2).sort((a,b)=>b.length-a.length)
    .map(t=>[...t].map(ch=>ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("[\\u0E47-\\u0E4E\\s#\\-]*"));
  if(!pats.length) return esc(text);
  let re; try{re=new RegExp("("+pats.join("|")+")","gi");}catch(e){return esc(text);}
  let out="",last=0; text.replace(re,(m,_g,off)=>{out+=esc(text.slice(last,off))+"<mark>"+esc(m)+"</mark>";last=off+m.length;return m;});
  return out+esc(text.slice(last));
}

  { const vals=ks.map(k=>it.prices[k].n).filter(n=>n!=null&&n>0); if(vals.length<2||vals.every(v=>v===vals[0])) best=null; }

  const listTxt=lists.length===1?fmt0(lists[0]):(lists.length?"หลายราคา":"–");
  const tiles=ks.map(k=>{

      <div class="off">ทุน Ex VAT</div><div class="nt">${fmt(p.n)}</div><div class="off">ขาย ${sellOf(p.n)==null?"–":fmt(sellOf(p.n))}</div>${listLine}</button>`;
  }).join("");
  const open=detailAll||openDetail.has(i);
  let detail="";
  if(open){
    const used=DISC_LABELS.map((_,j)=>j).filter(j=>ks.some(k=>it.prices[k].d[j]));
    const isB=k=>best!=null&&it.prices[k].n===best&&ks.length>1;

    const rows=ks.map(k=>{
      const p=it.prices[k];
      const ds=used.map(j=>p.d[j]?`<td class="d">${pn(p.d[j])}</td>`:`<td class="d z">–</td>`).join("");
      const off=p.l&&p.n!=null?pn(1-p.n/p.l):"–";
      return `<tr class="${isB(k)?"best":""}"><td class="cn">${esc(DB.chains[k])}</td>${showL?`<td>${fmt0(p.l)}</td>`:''}${ds}<td class="ntt">${fmt(p.n)}${p.sp?'<span class="sp">●</span>':""}</td><td class="sell">${sellOf(p.n)==null?"–":fmt(sellOf(p.n))}</td></tr>`;
    }).join("");
    detail=`<div class="detail"><table class="ht"><thead>${head}</thead><tbody>${rows}</tbody></table></div><div class="unit">ส่วนลดเป็น % · ราคาขายรวม Vat คิดที่ GP ${GP}% แนะนำ</div>`;
  }
  const tags=[
    it.size?`<span class="tag size">${esc(it.size)}</span>`:"",
    `<span class="tag mono" data-copy="${esc(it.id)}" title="คลิกเพื่อคัดลอก">${hl(it.id)}</span>`,
    it.bc?`<span class="tag mono" data-copy="${esc(it.bc)}" title="คลิกเพื่อคัดลอก">${hl(it.bc)}</span>`:"",
    it.mkt?`<span class="tag">${esc(it.mkt)}</span>`:"",
    it.sub?`<span class="tag">${esc(it.sub)}</span>`:"",

  ].join("");
  return `<article class="card">

}

async function saveFile(filename,blob){
  let dl=null;
  try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads"); }catch(e){dl=null;}
  if(dl){
    try{ await dl.save({filename,data:blob}); toast("บันทึกไฟล์แล้ว"); }
    catch(e){ if(e&&e.code==="declined") toast("ยกเลิกการบันทึก"); else if(e&&e.code==="rate_limited") toast("มีหน้าต่างบันทึกเปิดอยู่ ลองใหม่อีกครั้ง"); else toast("บันทึกไฟล์ในหน้านี้ไม่ได้"); }
    return;
  }
  // outside Claude (e.g. GitHub Pages): normal browser download
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.append(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},4000); toast("ดาวน์โหลดไฟล์แล้ว");
}

    const it=DB.items[i];
    const head=`▪️ ${it.th||it.en}`+(it.size?` [${it.size}]`:"");
    const sub=`บาร์โค้ด ${it.bc||it.id}`+(it.prices[ks[0]]&&it.prices[ks[0]].l!=null?` | ราคาตั้ง ${fmt(it.prices[ks[0]].l)}`:"");
    const lines=ks.map(k=>{const p=it.prices[k],s=sellOf(p.n);return `${DB.chains[k]} ทุน ${fmt(p.n)} | ขาย ${s==null?"–":fmt(s)}`;});
    return [head,sub,...lines].join("\n");
  });
  let txt=`ราคา Beger (ขายรวม VAT ที่ GP ${GP}%)\n\n`+blocks.join("\n\n");
  if(results.length>LINE_MAX) txt+=`\n\n…และอีก ${results.length-LINE_MAX} รายการ`;
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();toast(ok?`คัดลอก ${list.length} รายการแล้ว วางใน LINE ได้เลย`:"คัดลอกไม่สำเร็จ");};
  try{ navigator.clipboard.writeText(txt).then(()=>toast(`คัดลอก ${list.length} รายการแล้ว วางใน LINE ได้เลย`),fallback); }catch(e){ fallback(); }
}

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1600);}

function buildChains(){
  const box=$("chains"); box.querySelectorAll(".chip").forEach(x=>x.remove());
  DB.chains.forEach((c,k)=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=c;
    b.setAttribute("aria-pressed",activeChains.has(k));
    b.onclick=()=>{activeChains.has(k)?activeChains.delete(k):activeChains.add(k);b.setAttribute("aria-pressed",activeChains.has(k));saveChains();refreshKeepPage();};
    box.append(b);
  });
  const all=document.createElement("button");all.type="button";all.className="chip ghost";all.textContent="ทั้งหมด";
  all.onclick=()=>{const on=activeChains.size!==DB.chains.length;activeChains=new Set(on?DB.chains.map((_,k)=>k):[]);buildChains();saveChains();refreshKeepPage();};
  box.append(all);
}
function saveChains(){lsSet(LS_CHAINS,JSON.stringify(DB.chains.filter((_,k)=>activeChains.has(k))));}
function refreshKeepPage(){const s=shown;if($("fSort").value.startsWith("ntt")){runSearch();}shown=s;render();}

function fillFilters(){
  const sizes=[...new Set(DB.items.map(i=>i.size).filter(Boolean))].sort();
  const mkts=[...new Set(DB.items.map(i=>i.mkt).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"th"));
  const fill=(sel,vals,first)=>{const cur=sel.value;sel.innerHTML=`<option value="">${first}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(vals.includes(cur))sel.value=cur;};
  fill($("fSize"),sizes,"ทุกขนาด"); fill($("fMkt"),mkts,"ทุกกลุ่มสินค้า");
}

function useDB(db,label){
  DB=db; DB.label=label;
  IDX=buildIndex(DB.items);
  let saved=null; try{saved=JSON.parse(lsGet(LS_CHAINS)||"null");}catch(e){}
  activeChains=new Set(DB.chains.map((c,k)=>k).filter(k=>!Array.isArray(saved)||saved.includes(DB.chains[k])));
  if(!activeChains.size) activeChains=new Set(DB.chains.map((_,k)=>k));
  buildChains(); fillFilters();
  {const tc=lsGet(LS_TCHAIN);const ix=DB.chains.indexOf(tc);TCHAIN=ix>=0?ix:null;}
  $("meta").textContent=`${DB.items.length.toLocaleString("th-TH")} รายการ · ${DB.chains.length} ห้าง · ${label}`;
  runSearch();
}

function showImportPanel(html){const p=$("importPanel");p.innerHTML=html;p.hidden=!html;}

async function importFile(file){
  if(typeof XLSX==="undefined"){showImportPanel(`<h2>นำเข้าไฟล์ไม่ได้</h2><p>ตัวอ่าน Excel ยังโหลดไม่เสร็จ ลองใหม่อีกครั้งในไม่กี่วินาที</p>`);return;}
  showImportPanel(`<h2>กำลังอ่านไฟล์ ${esc(file.name)}…</h2>`);
  try{
    const buf=new Uint8Array(await file.arrayBuffer());
    const db=parseWorkbook(buf);
    const label=`${file.name} (นำเข้า ${new Date().toLocaleDateString("th-TH")})`;
    const kept=await idbPut({buf,label});
    useDB(db,label);
    showImportPanel(`<h2>อัปเดตราคาแล้ว</h2><p>อ่านได้ ${db.items.length.toLocaleString("th-TH")} รายการ จาก ${db.chains.length} ห้าง (${esc(db.chains.join(", "))})</p><p>${kept?"ไฟล์นี้จะถูกใช้ต่อในเบราว์เซอร์นี้จนกว่าจะกดกลับไปใช้ข้อมูลตั้งต้น":"เบราว์เซอร์นี้เก็บไฟล์ไว้ไม่ได้ เปิดหน้าใหม่แล้วจะกลับไปใช้ข้อมูลตั้งต้น"}</p><p><button class="btn" type="button" id="btnReset">กลับไปใช้ข้อมูลตั้งต้น</button> <button class="btn" type="button" id="btnClosePanel">ปิด</button></p>`);
    wirePanel();
  }catch(e){
    showImportPanel(`<h2>อ่านไฟล์ไม่สำเร็จ</h2><p>${esc(e.message||e)}</p><p>ไฟล์ต้องมีรูปแบบเดียวกับไฟล์ราคาเดิม: แถวที่ 1 เป็นชื่อห้าง แถวที่ 2 เป็นหัวคอลัมน์ (ITEM ID, DESCR_TH, ราคาตั้งใหม่, Std1 … New NTT XV)</p><p><button class="btn" type="button" id="btnClosePanel">ปิด</button></p>`);
    wirePanel();
  }
}
function wirePanel(){
  const r=$("btnReset"); if(r) r.onclick=async()=>{await idbDel();showImportPanel("");useDB(expandPacked(await decodeSeed()),SEED_LABEL);toast("กลับไปใช้ข้อมูลตั้งต้นแล้ว");};
  const c=$("btnClosePanel"); if(c) c.onclick=()=>showImportPanel("");
}

/* ---------- events ---------- */
let tmr; $("q").addEventListener("input",()=>{clearTimeout(tmr);tmr=setTimeout(runSearch,160);});
$("q").addEventListener("keydown",e=>{if(e.key==="Escape"){$("q").value="";runSearch();}});
$("clear").onclick=()=>{$("q").value="";runSearch();$("q").focus();};
["fSize","fMkt","fSort"].forEach(id=>$(id).addEventListener("change",runSearch));
$("viewbar").addEventListener("click",e=>{
  const v=e.target.closest("[data-view]"); if(v){VIEW=v.dataset.view;lsSet(LS_VIEW,VIEW);render();return;}
  const c=e.target.closest("[data-tchain]"); if(c){TCHAIN=+c.dataset.tchain;lsSet(LS_TCHAIN,DB.chains[TCHAIN]);render();}
  if(e.target.closest("#btnXlsx")) exportXlsx();
  if(e.target.closest("#btnLine")) copyLine();
});
$("btnMore").onclick=()=>{shown+=PAGE;render();};
$("btnDetail").onclick=()=>{detailAll=!detailAll;$("btnDetail").setAttribute("aria-pressed",detailAll);$("btnDetail").textContent=detailAll?"ซ่อนส่วนลดทุกขั้น":"แสดงส่วนลดทุกขั้น";lsSet(LS_DETAIL,detailAll?"1":"0");render();};
$("btnImport").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value="";};
$("list").addEventListener("click",e=>{
  const cp=e.target.closest("[data-copy]");
  if(cp){const v=cp.dataset.copy;
    const done=()=>toast("คัดลอก "+v+" แล้ว");
    try{navigator.clipboard.writeText(v).then(done,()=>{selectText(cp);toast("กด Ctrl+C เพื่อคัดลอก");});}catch(_){selectText(cp);}
    return;}
  const t=e.target.closest(".tile");
  if(t){const i=+t.dataset.card; openDetail.has(i)?openDetail.delete(i):openDetail.add(i); render();}
});
function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}

/* ---------- boot ---------- */
(async function boot(){
  detailAll=lsGet(LS_DETAIL)!=="0";
  {const v=lsGet(LS_VIEW);if(v==="card"||v==="table")VIEW=v;}
  {const g=parseFloat(lsGet(LS_GP));if(!isNaN(g)&&g>=0&&g<100)GP=g;}
  $("gp").value=GP;
  $("gp").addEventListener("input",()=>{const g=parseFloat($("gp").value);if(!isNaN(g)&&g>=0&&g<100){GP=g;lsSet(LS_GP,String(g));const s=shown;render();shown=s;}});
  if(detailAll){$("btnDetail").setAttribute("aria-pressed","true");$("btnDetail").textContent="ซ่อนส่วนลดทุกขั้น";}
  try{
    useDB(expandPacked(await decodeSeed()),SEED_LABEL);
  }catch(e){
    $("list").innerHTML=`<div class="empty">โหลดข้อมูลราคาไม่สำเร็จ (${esc(e.message||e)})<br>ลองเปิดด้วย Chrome หรือ Safari เวอร์ชันล่าสุด</div>`;
    return;
  }
  // a file imported earlier in this browser replaces the seed
  const saved=await idbGet();
  if(saved&&saved.buf){
    const wait=()=>new Promise(r=>{const t=setInterval(()=>{if(typeof XLSX!=="undefined"){clearInterval(t);r();}},100);setTimeout(()=>{clearInterval(t);r();},8000);});
    await wait();
    if(typeof XLSX!=="undefined"){
      try{useDB(parseWorkbook(saved.buf),saved.label);
        showImportPanel(`<h2>กำลังใช้ไฟล์ที่นำเข้าไว้</h2><p>${esc(saved.label)}</p><p><button class="btn" type="button" id="btnReset">กลับไปใช้ข้อมูลตั้งต้น</button> <button class="btn" type="button" id="btnClosePanel">ปิด</button></p>`);wirePanel();
      }catch(e){}
    }
  }
})();
})();
</script>
